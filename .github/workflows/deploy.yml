name: "Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Plan and Apply"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Start Ministack"
        run: |
            echo "Starting Ministack container..."
            docker run -d -p 4566:4566 ministackorg/ministack:latest

      - name: "Wait for Ministack to be ready"
        run: |
            echo "Waiting for Ministack to be ready..."
            until curl -s -f http://localhost:4566/_ministack/health > /dev/null; do
              sleep 1
            done
            echo "Ministack is ready!"
        
      - name: "Set up Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: 1.7.0

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Validate"
        run: terraform validate

      - name: "Terraform Plan"
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: "Terraform Apply"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
        
      - name: "Verify Deployment"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
            echo "Verifying bucket exists in runner's Ministack environment..."
            aws --endpoint-url=http://localhost:4566 s3 ls | grep "module-13-pipeline-verification-bucket" || (echo "Bucket not found!" && exit 1)